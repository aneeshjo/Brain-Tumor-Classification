# ==========================
# Data Transformation
# ==========================

IMAGE_SIZE: [224, 224]

BATCH_SIZE: 32

SEED: 42

TRAIN_SHUFFLE: True

TEST_SHUFFLE: False

# ==========================
# Model Training
# ==========================

EPOCHS: 20

LEARNING_RATE: 0.001

# ==========================
# CNN Architecture
# ==========================

INPUT_SHAPE: [224, 224, 3]

NUM_CLASSES: 4

CONV_FILTERS:
  - 32
  - 64
  - 128

KERNEL_SIZE: [3, 3]

POOL_SIZE: [2, 2]

DENSE_UNITS: 128

DROPOUT_RATE: 0.5
